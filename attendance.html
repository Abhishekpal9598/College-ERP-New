  <!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Management</title>

    <link rel="stylesheet" href="attendance.css">

</head>

<body>

    <div class="container">

        <!-- Heading -->

        <div class="page-header">

            <h1>📋 Attendance Management</h1>

        </div>

        <!-- Dashboard -->

        <div class="nav-buttons">

            <a href="dashboard.html" class="dashboard-btn">

                ← Dashboard

            </a>

        </div>

        <!-- Attendance Tabs -->

        <div class="attendance-tabs">

            <button

                id="studentTab"

                class="tab-btn active"

            >

                👨‍🎓 Student Attendance

            </button>

            <button

                id="teacherTab"

                class="tab-btn"

            >

                👨‍🏫 Teacher Attendance

            </button>

        </div>

        <!-- =========================

             STUDENT ATTENDANCE

        ========================== -->

        <section

            id="studentAttendanceSection"

            class="attendance-section"

        >

            <div class="section-header">

                <h2>👨‍🎓 Student Attendance</h2>

                <input

                    type="date"

                    id="studentDate"

                >

            </div>

            <div class="search-box">

                <input

                    type="text"

                    id="studentSearch"

                    placeholder="🔍 Search student..."

                >

            </div>

            <div class="table-box">

                <table>

                    <thead>

                        <tr>

                            <th>S.No.</th>

                            <th>Student Name</th>

                            <th>Roll No.</th>

                            <th>Branch</th>

                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody id="studentAttendanceTable">

                    </tbody>

                </table>

            </div>

            <div class="save-box">

                <button

                    id="saveStudentAttendance"

                    class="save-btn"

                >

                    💾 Save Student Attendance

                </button>

            </div>

        </section>

        <!-- =========================

             TEACHER ATTENDANCE

        ========================== -->

        <section

            id="teacherAttendanceSection"

            class="attendance-section hidden"

        >

            <div class="section-header">

                <h2>👨‍🏫 Teacher Attendance</h2>

                <input

                    type="date"

                    id="teacherDate"

                >

            </div>

            <div class="search-box">

                <input

                    type="text"

                    id="teacherSearch"

                    placeholder="🔍 Search teacher..."

                >

            </div>

            <div class="table-box">

                <table>

                    <thead>

                        <tr>

                            <th>S.No.</th>

                            <th>Teacher Name</th>

                            <th>Teacher ID</th>

                            <th>Subject</th>

                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody id="teacherAttendanceTable">

                    </tbody>

                </table>

            </div>

            <div class="save-box">

                <button

                    id="saveTeacherAttendance"

                    class="save-btn"

                >

                    💾 Save Teacher Attendance

                </button>

            </div>

        </section>

    </div>

    <script src="attendance.js"></script>

</body>

</html>
