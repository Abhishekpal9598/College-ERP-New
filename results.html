 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Result Management</title>

    <link
        rel="stylesheet"
        href="results.css"
    >

</head>


<body>


<div class="container">


    <!-- =========================
         PAGE HEADER
    ========================== -->

    <div class="page-header">

        <h1>📊 Result Management</h1>

    </div>


    <!-- =========================
         DASHBOARD BUTTON
    ========================== -->

    <div class="nav-buttons">

        <a
            href="dashboard.html"
            class="back-btn"
        >
            ← Dashboard
        </a>

    </div>


    <!-- =========================
         SELECT STUDENT
    ========================== -->

    <div class="student-selection">

        <label>
            Select Student
        </label>

        <select id="studentSelect">

            <option value="">
                -- Select Student --
            </option>

        </select>

    </div>


    <!-- =========================
         STUDENT INFORMATION
    ========================== -->

    <div
        id="studentInfo"
        class="student-info hidden"
    >

        <div class="info-box">

            <span>
                Student Name
            </span>

            <strong id="selectedStudentName">
                -
            </strong>

        </div>


        <div class="info-box">

            <span>
                Roll No.
            </span>

            <strong id="selectedStudentRoll">
                -
            </strong>

        </div>


        <div class="info-box">

            <span>
                Branch
            </span>

            <strong id="selectedStudentBranch">
                -
            </strong>

        </div>

    </div>


    <!-- =========================
         RESULT FORM
    ========================== -->

    <form
        id="resultForm"
        class="form-box"
    >

        <input
            type="text"
            id="subject"
            placeholder="Subject"
        >


        <input
            type="number"
            id="marks"
            placeholder="Marks"
            min="0"
            max="100"
        >


        <button
            type="submit"
            id="addResultBtn"
        >
            Add Result
        </button>

    </form>


    <!-- =========================
         RESULT HEADER
    ========================== -->

    <div class="result-header">

        <h2>
            📋 Student Result
        </h2>

        <div class="result-summary">

            <span>
                Total Subjects:
                <strong id="totalSubjects">
                    0
                </strong>
            </span>

            <span>
                Total Marks:
                <strong id="totalMarks">
                    0
                </strong>
            </span>

            <span>
                Percentage:
                <strong id="percentage">
                    0%
                </strong>
            </span>

        </div>

    </div>


    <!-- =========================
         RESULT TABLE
    ========================== -->

    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>
                        S.No.
                    </th>

                    <th>
                        Subject
                    </th>

                    <th>
                        Marks
                    </th>

                    <th>
                        Grade
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="resultTable">

            </tbody>

        </table>

    </div>


    <!-- =========================
         NO RESULT MESSAGE
    ========================== -->

    <div
        id="noResult"
        class="no-result"
    >

        Please select a student to view result.

    </div>


</div>


<script src="results.js"></script>


</body>

</html>
