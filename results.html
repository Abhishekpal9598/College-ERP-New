<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Management</title>

    <link rel="stylesheet" href="results.css">
</head>

<body>

    <div class="container">

        <h1>📊 Result Management</h1>

        <div class="nav-buttons">
            <a href="dashboard.html" class="back-btn">⬅ Dashboard</a>
        </div>

        <div class="top-section">

            <input
                type="text"
                id="searchResult"
                placeholder="Search Result">

            <h2>
                Total Results:
                <span id="totalResults">0</span>
            </h2>

        </div>

        <form id="resultForm" class="form-box">

            <input
                type="text"
                id="studentName"
                placeholder="Student Name">

            <input
                type="text"
                id="rollNo"
                placeholder="Roll Number">

            <input
                type="text"
                id="subject"
                placeholder="Subject">

            <input
                type="number"
                id="marks"
                placeholder="Marks"
                min="0"
                max="100">

            <button
                type="submit"
                id="addResultBtn">
                Add Result
            </button>

        </form>

        <table>

            <thead>

                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Subject</th>
                    <th>Marks</th>
                    <th>Grade</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="resultTable">

            </tbody>

        </table>

    </div>

    <script src="results.js"></script>

</body>

</html>
