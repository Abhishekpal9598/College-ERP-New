<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings</title>

    <link rel="stylesheet" href="settings.css">

</head>

<body>

    <div class="container">

        <h1>⚙️ Settings</h1>

        <div class="nav-buttons">

            <a href="dashboard.html" class="back-btn">
                ⬅ Dashboard
            </a>

        </div>

        <form id="settingsForm" class="form-box">

            <input
                type="text"
                id="collegeName"
                placeholder="College Name">

            <input
                type="text"
                id="adminName"
                placeholder="Admin Name">

            <button
                type="submit"
                id="saveBtn">

                Save Settings

            </button>

        </form>

        <div class="preview">

            <h2>Current Settings</h2>

            <p>
                <strong>College:</strong>
                <span id="showCollege">Not Set</span>
            </p>

            <p>
                <strong>Admin:</strong>
                <span id="showAdmin">Not Set</span>
            </p>

        </div>

    </div>

    <script src="settings.js"></script>

</body>

</html>
