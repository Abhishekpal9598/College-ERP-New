<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - College ERP</title>
    <link rel="stylesheet" href="students.css">

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth-guard.js"></script>
    <script>
        requireAuth();
    </script>
</head>

<body>

    <div class="container">

        <!-- Page Heading -->
        <div class="page-header">
            <h1>👨‍🎓 Student Management</h1>
        </div>

        <!-- Navigation -->
        <div class="nav-buttons">
            <a href="../dashboard/dashboard.html" class="back-btn">
                ← Dashboard
            </a>
        </div>

        <!-- Search + Total Students -->
        <div class="top-section">
            <input
                type="text"
                id="searchStudent"
                placeholder="🔍 Search student..."
            >

            <h2>
                Total Students:
                <span id="totalStudents">0</span>
            </h2>
        </div>

        <!-- Student Form -->
        <form id="studentForm" class="form-box">
            <input
                type="text"
                id="studentName"
                placeholder="Student Name"
                required
            >

            <input
                type="text"
                id="rollNo"
                placeholder="Roll Number"
                required
            >

            <input
                type="text"
                id="branch"
                placeholder="Branch"
                required
            >

            <button type="submit">
                Add Student
            </button>
        </form>

        <!-- Student Table -->
        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>S.No.</th>
                        <th>Student Name</th>
                        <th>Roll No.</th>
                        <th>Branch</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                    <!-- Students will appear here -->
                </tbody>
            </table>
        </div>

    </div>

    <script src="students.js"></script>
</body>

</html>
