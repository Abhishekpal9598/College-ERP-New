<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Management - College ERP</title>
    <style id="auth-guard-css">
        body {
            display: none !important;
            visibility: hidden !important;
        }
    </style>
    <noscript>
        <meta http-equiv="refresh" content="0;url=/pages/login/login.html">
        <style>body { display: none !important; }</style>
    </noscript>

    <link rel="stylesheet" href="results.css">

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth-guard.js"></script>
    <script>
        requireAuth();
    </script>
</head>

<body>

    <div class="container">

        <!-- Page Header -->
        <div class="page-header">
            <h1>📊 Result Management</h1>
        </div>

        <!-- Dashboard Button -->
        <div class="nav-buttons">
            <a href="../dashboard/dashboard.html" class="back-btn">
                ← Dashboard
            </a>
        </div>

        <!-- Select Student -->
        <div class="student-selection">
            <label for="studentSelect">Select Student</label>
            <select id="studentSelect">
                <option value="">-- Select Student --</option>
            </select>
        </div>

        <!-- Student Information -->
        <div id="studentInfo" class="student-info hidden">
            <div class="info-box">
                <span>Student Name</span>
                <strong id="selectedStudentName">-</strong>
            </div>

            <div class="info-box">
                <span>Roll No.</span>
                <strong id="selectedStudentRoll">-</strong>
            </div>

            <div class="info-box">
                <span>Branch</span>
                <strong id="selectedStudentBranch">-</strong>
            </div>
        </div>

        <!-- Result Form -->
        <form id="resultForm" class="form-box">
            <input
                type="text"
                id="subject"
                placeholder="Subject"
                required
            >

            <input
                type="number"
                id="marks"
                placeholder="Marks"
                min="0"
                max="100"
                required
            >

            <button type="submit" id="addResultBtn">
                Add Result
            </button>
        </form>

        <!-- Result Header -->
        <div class="result-header">
            <h2>📋 Student Result</h2>

            <div class="result-summary">
                <span>
                    Total Subjects:
                    <strong id="totalSubjects">0</strong>
                </span>

                <span>
                    Total Marks:
                    <strong id="totalMarks">0</strong>
                </span>

                <span>
                    Percentage:
                    <strong id="percentage">0%</strong>
                </span>
            </div>
        </div>

        <!-- Result Table -->
        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>S.No.</th>
                        <th>Subject</th>
                        <th>Marks</th>
                        <th>Grade</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="resultTable">
                    <!-- Student Results will appear here -->
                </tbody>
            </table>
        </div>

        <!-- No Result Message -->
        <div id="noResult" class="no-result">
            Please select a student to view result.
        </div>

    </div>

    <script src="results.js"></script>
</body>

</html>
